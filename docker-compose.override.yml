# Dev overrides — merged automatically by `docker compose up`.
# Production: `docker compose -f docker-compose.yml up -d`.
services:
  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports: !override
      - "8000:8000"  # dev: open on all interfaces for /api/v1/docs etc.
    volumes:
      - ./backend/app:/app/app
