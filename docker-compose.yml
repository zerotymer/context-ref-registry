# Production-style stack: `docker compose -f docker-compose.yml up -d`
# Plain `docker compose up` also merges docker-compose.override.yml (dev: reload + bind mount).
services:
  api:
    build: ./backend
    ports:
      # Loopback only: a host reverse proxy can route /api/v1/* here (path-split
      # mode) without exposing the API publicly. See docs/12-reverse-proxy.md.
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env  # ADMIN_PASSWORD (required), optional ADMIN_LOGIN_ID / JWT_SECRET
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/registry.db
      # The frontend BFF reaches MCP as http://api:8000 — allow that Host (localhost is always allowed).
      - MCP_ALLOWED_HOSTS=api:*
    volumes:
      - registry_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # REST + MCP are served under /api/v1 (MCP: /api/v1/mcp, read-only, API key
  # auth); only /health stays at root. The frontend exposes the same /api/v1
  # paths, so a reverse proxy may send everything to :3000, or split /api/v1/*
  # to :8000 — see docs/12-reverse-proxy.md.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BACKEND_API_URL=http://api:8000
    depends_on:
      - api

# Backup: stop api, then copy registry.db, registry.db-wal, registry.db-shm out of the volume.
volumes:
  registry_data:

