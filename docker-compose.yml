# Production-style stack: `docker compose -f docker-compose.yml up -d`
# Plain `docker compose up` also merges docker-compose.override.yml (dev: reload + bind mount).
services:
  api:
    build:
      context: ./backend
      secrets:
        - nexus_pypi
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env  # ADMIN_PASSWORD (required), optional ADMIN_LOGIN_ID / JWT_SECRET
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/registry.db
    volumes:
      - registry_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # MCP is served by the `api` service as a streamable-http endpoint at
  # :8000/mcp (read-only, API key auth). No separate stdio service.
  # Recommended external entry point is the frontend BFF proxy
  # (`:3000/api/v1/mcp`); the direct `:8000` publish is kept for local dev
  # (/docs, REST). Recovering it to internal-only is deferred to deployment.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BACKEND_API_URL=http://api:8000
    depends_on:
      - api

# Backup: stop api, then copy registry.db, registry.db-wal, registry.db-shm out of the volume.
volumes:
  registry_data:

secrets:
  nexus_pypi:
    environment: NEXUS_PYPI_URL
