name: Release

# Push a tag like v2.1.0 → run CI → build linux/amd64 images and push to:
#   ghcr.io/<owner>/llm-registry-{api,front}:{2.1.0,latest}
#   docker.io/<DOCKERHUB_USERNAME>/llm-registry-{api,front}:{2.1.0,latest}
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (GHCR uses the built-in GITHUB_TOKEN).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: llm-registry-api
            context: backend
          - image: llm-registry-front
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ env.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
