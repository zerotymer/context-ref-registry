name: Release

# Push a tag like v2.1.0 → run CI → build and push images to Docker Hub:
#   <namespace>/llm-registry-api:{2.1.0,latest}, <namespace>/llm-registry-front:{2.1.0,latest}
# Secrets: UV_TOML, NPMRC (see ci.yml), DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  IMAGE_NAMESPACE: zerotymer

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: llm-registry-api
            context: backend
            build_secret: uv_config
            repo_secret: UV_TOML
          - image: llm-registry-front
            context: frontend
            build_secret: npmrc
            repo_secret: NPMRC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Prepare version and package config
        env:
          PKG_CONFIG: ${{ secrets[matrix.repo_secret] }}
        run: |
          if [ -z "$PKG_CONFIG" ]; then
            echo "::error::${{ matrix.repo_secret }} secret is not set"; exit 1
          fi
          printf '%s\n' "$PKG_CONFIG" > "$RUNNER_TEMP/pkg-config"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The package config is a BuildKit secret: used during install, never stored in a layer.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          secret-files: ${{ matrix.build_secret }}=${{ runner.temp }}/pkg-config
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ env.VERSION }}
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:latest
